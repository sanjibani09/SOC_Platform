services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: socdb
      POSTGRES_USER: soc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_dev_password}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soc -d socdb"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  ml-service:
    build: ./ml-service
    ports: ["8000:8000"]
    environment:
      MODEL_PATH: /app/model.joblib
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    ports: ["8080:8080"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/socdb
      SPRING_DATASOURCE_USERNAME: soc
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-soc_dev_password}
      SPRING_DATA_REDIS_HOST: redis
      ML_SERVICE_URL: http://ml-service:8000
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-this-32-characters-minimum}
      APP_CORS_ORIGIN: http://localhost:5173
      SOC_ADMIN_EMAIL: ${SOC_ADMIN_EMAIL:-admin@soc.local}
      SOC_ADMIN_PASSWORD: ${SOC_ADMIN_PASSWORD:-ChangeMe123!}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      ml-service: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  postgres_data:
